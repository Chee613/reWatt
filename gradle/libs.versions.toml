[versions]
agp = "9.2.0"
kotlin = "2.3.20"
ksp = "2.3.8"
composeBom = "2026.05.00"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
fragmentKtx = "1.8.9"
lifecycle = "2.10.0"
room = "2.8.4"
usbSerial = "3.9.0"
cameraX = "1.6.1"
tflite = "2.17.0"
